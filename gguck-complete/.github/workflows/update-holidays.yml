name: Update Korean holidays

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-holidays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch holidays (this year + next 2 years)
        env:
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
        run: |
          YEAR=$(date +%Y)
          node scripts/fetch-korean-holidays.mjs "$YEAR" "$((YEAR + 1))" "$((YEAR + 2))"

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/koreanHolidays.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: 공휴일 데이터 자동 갱신"
            git push
          fi
